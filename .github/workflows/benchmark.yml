name: benchmark

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    if: ${{ vars.ENABLE_VRM_BENCHMARK_WORKFLOW_BENCHMARK_JOB == 'true' }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # CodSpeed can only generate flamegraphs with Python 3.12 or later
      - run: echo 3.13 > .python-version
      # For reasons unknown, flamegraphs cannot be generated with Codspeed unless Python is installed via
      # actions/setup-python.
      - uses: actions/setup-python@v7.1.0
      - run: git ls-files pyproject.toml "**/pyproject.toml" | xargs sed -i~ 's/^requires-python = "==3\.10\.\*" /requires-python = "==3.13.*" /'
      - uses: astral-sh/setup-uv@v10.3.3
      - run: |
          # Package installation fails about 5% of the time depending on the environment, so retry
          for _ in $(seq 5); do
            if uv sync --no-managed-python; then
              break
            fi
          done
      - run: git diff
      - uses: CodSpeedHQ/action@v5.6.3
        with:
          mode: simulation
          run: uv run pytest src/ --codspeed
          working-directory: benchmarks
