name: test

permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
  workflow_dispatch:

env:
  BLENDER_ARCHIVE_BASE_URL: https://download.blender.org/release

jobs:
  test-windows:
    name: test-windows / ${{ matrix.blender.job_name_postfix }}
    runs-on: windows-2025
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        blender:
          - job_name_postfix: blender 5.3
            archive_url_path: Blender5.3/blender-5.3.0-windows-x64.zip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cache archive
        id: cache-archive
        uses: actions/cache@v6.1.0
        with:
          path: .local/tmp/blender.zip
          key: ${{ matrix.blender.archive_url_path }}-archive-12
      - name: Download archive
        if: ${{ steps.cache-archive.outputs.cache-hit != 'true' }}
        env:
          BLENDER_ARCHIVE_URL: ${{ env.BLENDER_ARCHIVE_BASE_URL }}/${{ matrix.blender.archive_url_path }}
        run: |
          $retry = 10
          for (; $true; $retry--) {
            try {
              Start-BitsTransfer .local\tmp\blender.zip -Source $env:BLENDER_ARCHIVE_URL
              break
            } catch {
              if ($retry -le 0) {
                throw $_.Exception
              }
            }
            Start-Sleep -Seconds 60
          }
      - name: Test
        run: |
          Expand-Archive -LiteralPath .local\tmp\blender.zip -DestinationPath .github\blender
          $env:BLENDER_VRM_TEST_BLENDER_PATH = (Get-ChildItem ".github\blender\*\blender.exe")[0].FullName
          & $env:BLENDER_VRM_TEST_BLENDER_PATH --background -noaudio --python-exit-code 1 --python tools\unittest_discover.py
      - name: Archive failed io test result
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: VRMs (${{ github.job }} ${{ matrix.blender.job_name_postfix }})
          path: tests/resources/vrm/*/temp

  test-macos:
    name: test-macos / ${{ matrix.blender.job_name_postfix }}
    runs-on: macos-26
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        blender:
          - job_name_postfix: blender 5.3 arm64
            archive_url_path: Blender5.3/blender-5.3.0-macos-arm64.dmg
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cache archive
        id: cache-archive
        uses: actions/cache@v6.1.0
        with:
          path: .local/tmp/blender.dmg
          key: ${{ matrix.blender.archive_url_path }}-archive-12
      - name: Download archive
        if: ${{ steps.cache-archive.outputs.cache-hit != 'true' }}
        env:
          BLENDER_ARCHIVE_URL: ${{ env.BLENDER_ARCHIVE_BASE_URL }}/${{ matrix.blender.archive_url_path }}
        run: |
          curl --fail --show-error --location --retry 5 --retry-all-errors --output .local/tmp/blender.dmg "$BLENDER_ARCHIVE_URL"
      - name: Install dependencies
        run: |
          set -x
          for retry in $(seq 5 -1 0); do
            if perl \
              -Mstrict \
              -Mwarnings \
              -e 'my $pid = fork(); if ($pid == 0) { exec(@ARGV); exit(1); } local $SIG{ALRM} = sub { kill(9, $pid); }; alarm(600); waitpid($pid, 0); exit($? != 0);' \
              -- \
              sh -exc "brew update && brew install ffmpeg imagemagick"; then
              break
            fi

            if [ "$retry" -eq 0 ]; then
              >&2 echo "Failed to install dependencies"
              exit 1
            fi

            sleep 300
          done
      - name: Test
        run: |
          unpack_path=$(mktemp -d)
          hdiutil attach .local/tmp/blender.dmg -mountpoint "$unpack_path"
          cp -fr "${unpack_path}/Blender.app" .github/Blender.app
          hdiutil detach "$unpack_path" || true
          ./.github/Blender.app/Contents/MacOS/blender --background -noaudio --python-exit-code 1 --python tools/unittest_discover.py
      - name: Archive failed io test result
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: VRMs (${{ github.job }} ${{ matrix.blender.job_name_postfix }})
          path: tests/resources/vrm/*/temp

  test-linux:
    name: test-linux / ${{ matrix.blender.job_name_postfix }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        blender:
          - job_name_postfix: blender 5.3
            archive_url_path: Blender5.3/blender-5.3.0-linux-x64.tar.xz
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cache archive
        id: cache-archive
        uses: actions/cache@v6.1.0
        with:
          path: .local/tmp/blender.tar.xz
          key: ${{ matrix.blender.archive_url_path }}-archive-12
      - name: Download archive
        if: ${{ steps.cache-archive.outputs.cache-hit != 'true' }}
        env:
          BLENDER_ARCHIVE_URL: ${{ env.BLENDER_ARCHIVE_BASE_URL }}/${{ matrix.blender.archive_url_path }}
        run: |
          curl --fail --show-error --location --retry 5 --retry-all-errors --output .local/tmp/blender.tar.xz "$BLENDER_ARCHIVE_URL"
      - name: Install dependencies
        run: if sudo --non-interactive true; then sudo ./tools/install_ubuntu_packages.sh; fi
      - name: Test
        run: |
          blender_base_path="$PWD/.github/blender"
          mkdir -p "$blender_base_path"
          tar -x --strip-components=1 -f .local/tmp/blender.tar.xz -C "$blender_base_path"
          "${blender_base_path}/blender" --background -noaudio --python-exit-code 1 --python tools/unittest_discover.py
      - name: Archive failed io test result
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: VRMs (${{ github.job }} ${{ matrix.blender.job_name_postfix }})
          path: tests/resources/vrm/*/temp
