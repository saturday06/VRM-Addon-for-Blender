# SPDX-License-Identifier: MIT OR GPL-3.0-or-later
name: lint

permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install deb packages
        run: if sudo --non-interactive true; then sudo ./tools/install_ubuntu_packages.sh; fi
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: true
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install UV dependencies
        run: |
          # Package installation fails about 5% of the time depending on the environment, so retry
          for _ in $(seq 5); do
            if uv sync; then
              break
            fi
          done
      - name: Check source code formatting
        run: |
          ./tools/format.sh
          git diff --exit-code
      - name: Check property type annotations
        run: |
          uv run python tools/property_typing.py > property_typing.log
          ./tools/format.sh
          git diff --exit-code
      - name: Lint
        run: ./tools/lint.sh
      - run: gh extension install github/gh-actions-lock
      - run: gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}
  examples:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: examples/command_line_tool
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: true
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install UV dependencies
        run: |
          # Package installation fails about 5% of the time depending on the environment, so retry
          for _ in $(seq 5); do
            if uv sync; then
              break
            fi
          done
      - name: Run examples
        run: uv run main.py
      - name: Validate VRM Model
        run: vp run vrm-validator

  audit:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv audit
      - uses: voidzero-dev/setup-vp@v1.22.0
      - run: vp pm audit

  super-linter:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Super-Linter
        run: ./tools/super-linter.sh -e SAVE_SUPER_LINTER_SUMMARY=false

  devcontainer:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Cache archive
        id: cache-archive
        uses: actions/cache@v6.1.0
        with:
          path: .local/tmp/ci-devcontainer-cache
          key: devcontainer-${{ hashFiles('.devcontainer/devcontainer.json', '.devcontainer/Dockerfile') }}-1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: true
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker-container
      - run: |
          mkdir -p .local/tmp/ci-devcontainer-cache
          vp run devcontainer build \
            --cache-from type=local,src=.local/tmp/ci-devcontainer-cache \
            --cache-to type=local,dest=.local/tmp/ci-devcontainer-cache
          vp run devcontainer up
          vp run devcontainer exec -- cat src/io_scene_vrm/README.txt

  docs:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          run-install: true
      - name: Build
        run: vp run docs:build
