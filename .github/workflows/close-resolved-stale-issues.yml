name: close-resolved-stale-issues

permissions: {}

on:
  schedule:
    - cron: "0 0 * * *"

jobs:
  close-resolved-stale-issues:
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      pull-requests: write
    if: ${{ github.repository_visibility == 'public' }}
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-stale: -1
          days-before-close: 120
          stale-issue-label: "resolved; will close if no new info for 120 days"
          stale-pr-label: "resolved; will close if no new info for 120 days"
          close-issue-message: "This issue was closed because it has been inactive for 120 days since being marked as resolved."
          close-pr-message: "This PR was closed because it has been inactive for 120 days since being marked as resolved."
          close-issue-reason: completed
